<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fade Sequence</title>

  <!-- Google Font: Inter (medium weight, close match to reference) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  cursor: default;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  z-index: 1;
}

.stage {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  padding: 0 24px;
  pointer-events: none;
}

.fade-text {
  color: #ffffff;
  font-weight: 500;
  font-size: clamp(1.6rem, 4.2vw, 3.4rem);
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.4;
  max-width: 900px;
  opacity: 0;
  filter: blur(6px);
  transform: translateY(6px) scale(0.98);
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.15);
  transition:
    opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1),
    filter 1.4s cubic-bezier(0.22, 1, 0.36, 1),
    transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
}

.fade-text.visible {
  opacity: 1;
  filter: blur(0px);
  transform: translateY(0) scale(1);
}

@media (max-width: 600px) {
  .fade-text {
    font-size: clamp(1.3rem, 6vw, 2rem);
    letter-spacing: 0.02em;
    max-width: 100%;
  }
}
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <main class="stage">
    <h1 id="text-line" class="fade-text"></h1>
  </main>

  <script>
(function () {
  'use strict';

  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  let width, height, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  const PALETTE = [
    '255, 255, 255',
    '255, 165, 60',
    '255, 220, 90',
    '90, 160, 255',
    '255, 120, 180'
  ];

  function randomColor() {
    return PALETTE[Math.floor(Math.random() * PALETTE.length)];
  }
  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  class GlowDot {
    constructor() {
      this.reset(true);
    }

    reset(randomStart) {
      this.x = rand(0, width);
      this.y = randomStart ? rand(0, height) : height + 20;
      this.radius = rand(1, 2.6);
      this.baseAlpha = rand(0.25, 0.7);
      this.alpha = this.baseAlpha;
      this.color = randomColor();
      this.vx = rand(-0.08, 0.08);
      this.vy = rand(-0.18, -0.04);
      this.pulseSpeed = rand(0.005, 0.015);
      this.pulseOffset = rand(0, Math.PI * 2);
    }

    update(time) {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha = this.baseAlpha * (0.6 + 0.4 * Math.sin(time * this.pulseSpeed + this.pulseOffset));

      if (this.y < -20 || this.x < -20 || this.x > width + 20) {
        this.reset(false);
      }
    }

    draw() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 8);
      glow.addColorStop(0, `rgba(${this.color}, ${this.alpha})`);
      glow.addColorStop(1, `rgba(${this.color}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class FireworkParticle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = rand(0, Math.PI * 2);
      const speed = rand(0.6, 3.2);
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.radius = rand(1, 2.2);
      this.life = 1;
      this.decay = rand(0.008, 0.02);
      this.friction = 0.96;
    }

    update() {
      this.vx *= this.friction;
      this.vy *= this.friction;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }

    draw() {
      if (this.life <= 0) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const alpha = Math.max(this.life, 0);
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 6);
      glow.addColorStop(0, `rgba(${this.color}, ${alpha})`);
      glow.addColorStop(1, `rgba(${this.color}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(${this.color}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class Firework {
    constructor() {
      const margin = 0.18;
      this.x = rand(width * margin, width * (1 - margin));
      this.y = rand(height * margin, height * (1 - margin));
      this.color = randomColor();
      this.particles = [];
      const count = Math.floor(rand(14, 26));
      for (let i = 0; i < count; i++) {
        this.particles.push(new FireworkParticle(this.x, this.y, this.color));
      }
    }

    update() {
      this.particles.forEach((p) => p.update());
      this.particles = this.particles.filter((p) => p.life > 0);
    }

    draw() {
      this.particles.forEach((p) => p.draw());
    }

    get isDone() {
      return this.particles.length === 0;
    }
  }

  const DOT_COUNT = Math.min(70, Math.floor((width * height) / 14000));
  const dots = Array.from({ length: DOT_COUNT }, () => new GlowDot());
  let fireworks = [];

  function scheduleFirework() {
    const delay = rand(1400, 3200);
    setTimeout(() => {
      fireworks.push(new Firework());
      scheduleFirework();
    }, delay);
  }
  scheduleFirework();

  function animate(time) {
    ctx.clearRect(0, 0, width, height);

    dots.forEach((dot) => {
      dot.update(time);
      dot.draw();
    });

    fireworks.forEach((fw) => {
      fw.update();
      fw.draw();
    });
    fireworks = fireworks.filter((fw) => !fw.isDone);

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  const SENTENCES = [
    'Some ideas start as a whisper.',
    'They grow quietly in the dark.',
    'Then, all at once, they ignite.',
    'This is where thoughts become light.'
  ];

  const textEl = document.getElementById('text-line');
  let sentenceIndex = 0;

  const VISIBLE_DURATION = 3200;
  const FADE_DURATION = 1400;

  function showNextSentence() {
    textEl.textContent = SENTENCES[sentenceIndex];

    requestAnimationFrame(() => {
      textEl.classList.add('visible');
    });

    setTimeout(() => {
      textEl.classList.remove('visible');
      setTimeout(() => {
        sentenceIndex = (sentenceIndex + 1) % SENTENCES.length;
        showNextSentence();
      }, FADE_DURATION);
    }, VISIBLE_DURATION + FADE_DURATION);
  }

  showNextSentence();
})();
  </script>
</body>
</html>
